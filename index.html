<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NidhiSetu - AICTE FDR Portal</title>
<style>*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f3f6fb;color:#1a1a1a}
nav{background:#004aad;color:#fff;padding:10px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:600;cursor:pointer}nav .b{font-size:20px;margin-right:auto;font-weight:700}
main{max-width:1150px;margin:20px auto;padding:0 16px}.card{background:#fff;border:1px solid #cfd8e6;border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid #e3e8f0;text-align:left;vertical-align:top}th{background:#eaf2fb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.st{background:#fff;border:1px solid #cfd8e6;border-radius:10px;padding:12px;text-align:center}.st b{display:block;font-size:26px;color:#004aad}
input,select,textarea{width:100%;padding:8px;border:1px solid #b9c5d8;border-radius:6px;margin:4px 0 10px;font:inherit}input[type=checkbox],input[type=radio]{width:auto}
button,.btn{background:#004aad;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block;font:inherit;font-weight:600;margin:2px}.o{background:#e8751a}.r{background:#c0392b}.g{background:#1e8449}
.tag{padding:2px 9px;border-radius:12px;color:#fff;font-size:12px;font-weight:700}.High,.high{background:#c0392b}.Med,.medium{background:#e8751a}.Low{background:#1e8449}
.msg{padding:10px;border-radius:6px;margin-bottom:12px}.okm{background:#dff3e4}.err{background:#fbdcd8}.lad{display:flex;gap:6px}.lad div{flex:1;padding:10px;text-align:center;background:#dde5f0;border-radius:6px;font-size:13px}.lad .on{background:#1e8449;color:#fff;font-weight:700}
.small{font-size:12px;color:#555}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}}code{background:#eef2f8;padding:2px 5px;border-radius:4px;word-break:break-all}.mid{max-width:480px;margin:30px auto}a.l{color:#004aad;cursor:pointer;text-decoration:underline}</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const MIN_AMOUNT=500000, MIN_MONTHS=12; // configurable rules: set per current AICTE handbook
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=x=>Number(x).toLocaleString('en-IN'), iso=d=>d.toISOString().slice(0,10), today=()=>iso(new Date());
const dd=s=>Math.round((new Date(s)-new Date(today()))/864e5);
async function sha(s){try{const b=typeof s==='string'?new TextEncoder().encode(s):s;const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;const t=typeof s==='string'?s:String(s.byteLength);for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function seed(){return{users:[{u:'admin',p:await sha('admin123'),role:'admin',name:'Regulation Bureau Head'},{u:'officer',p:await sha('officer123'),role:'officer',name:'Section Officer'},{u:'college',p:await sha('college123'),role:'institution',inst:1,name:'Demo Institute Registrar'}],insts:[{id:1,name:'Demo Institute of Technology',aicte:'1-0000001'}],fdrs:[],rel:[],rem:[],tok:[],audit:[],n:{f:0,r:0,i:1}}}
let DB,ME=JSON.parse(sessionStorage.getItem('ns_me')||'null'),FLASH=[],LINK={};
const save=()=>localStorage.setItem('ns_db',JSON.stringify(DB)), flash=(m,c='okm')=>FLASH.push([m,c]);
async function audit(a,d=''){const prev=DB.audit.length?DB.audit[DB.audit.length-1].hash:'GENESIS',ts=new Date().toISOString().slice(0,19),actor=ME?ME.u:'system';DB.audit.push({id:DB.audit.length+1,ts,actor,a,d,prev,hash:await sha(`${prev}|${ts}|${actor}|${a}|${d}`)})}
function flags(f){const o=[],i=new Date(f.issue),m=new Date(f.maturity);
 if(m<=i)o.push(['high','Maturity date is not after the issue date.']);else if((m-i)/864e5<MIN_MONTHS*30)o.push(['medium',`Tenure is below the configured minimum of ${MIN_MONTHS} months.`]);
 if(dd(f.maturity)<0)o.push(['high','FDR has already matured.']);if(f.amount<MIN_AMOUNT)o.push(['high',`Amount is below the configured minimum of Rs ${inr(MIN_AMOUNT)}.`]);
 if(!f.lien)o.push(['high','Lien in favour of AICTE is not declared.']);if(!f.doc)o.push(['medium','No supporting document uploaded.']);
 DB.fdrs.filter(x=>x.id!==f.id&&x.fdr.toLowerCase()===f.fdr.toLowerCase()&&x.bank.toLowerCase()===f.bank.toLowerCase()).forEach(x=>o.push(['high',`Same FDR number and bank already submitted (case #${x.id}).`]));
 if(f.hash)DB.fdrs.filter(x=>x.id!==f.id&&x.hash===f.hash).forEach(x=>o.push(['high',`Identical document file already attached to case #${x.id}.`]));
 (f.disp||[]).forEach(t=>o.push(['high','Bank DISPUTED this FDR: '+t]));return o}
function lvl(f){const hi=flags(f).some(x=>x[0]==='high');let l=0;if(f.docok)l=1;if(l>=1&&f.scr&&!hi)l=2;if(l>=2&&f.bank_by)l=3;if(l>=3&&f.recon)l=4;return l}
const done=f=>['released','renewed','rejected'].includes(f.status);
function risk(f){if(done(f))return 0;const d=dd(f.maturity);let r=d<0?60:Math.max(0,60*(90-d)/90);if(d<=60&&!DB.fdrs.some(x=>x.parent===f.id))r+=20;if(lvl(f)<3)r+=10;r+=Math.min(10,(f.seats||0)/50);return Math.min(100,Math.floor(r))}
function esc2(f){if(done(f))return'-';const d=dd(f.maturity);return d<0?'Overdue: Bureau Head':d<=7?'Bureau Head':d<=15?'Regional Officer':d<=30?'Section Officer':d<=60?'Institution reminder':'-'}
const label=f=>({released:'Released',renewed:'Renewed',rejected:'Rejected'})[f.status]||(dd(f.maturity)<0?'Matured':f.status==='submitted'?'Active (pending verification)':'Active');
const iname=f=>(DB.insts.find(i=>i.id===f.inst)||{}).name||'?', byId=id=>DB.fdrs.find(f=>f.id==id);
function ready(f){const r=[];if(lvl(f)<3)r.push('Bank confirmation (L3) is missing.');if(flags(f).some(x=>x[0]==='high'))r.push('Unresolved high-severity flags.');
 const last=[...DB.rel].reverse().find(x=>x.fdr===f.id);if(!((last&&last.cycle)||DB.fdrs.some(x=>x.parent===f.id&&x.status==='verified')))r.push('Approval cycle not declared closed and no verified replacement FDR.');return r}
const tag=r=>`<span class="tag ${r>=70?'High':r>=40?'Med':'Low'}">${r}</span>`;
const row=(f,off)=>`<tr><td>#${f.id}</td>${off?`<td>${esc(iname(f))}</td>`:''}<td><a class="l" href="#/fdr/${f.id}">${esc(f.fdr)}</a><br><span class="small">${esc(f.bank)}</span></td><td>${inr(f.amount)}</td><td>${f.maturity}<br><span class="small">${dd(f.maturity)} days</span></td><td>${label(f)}</td><td>L${lvl(f)}</td><td>${tag(risk(f))}</td>${off?`<td>${esc2(f)}</td>`:''}</tr>`;
function nav(){$('#nav').innerHTML=`<span class="b">NidhiSetu <small style="font-weight:400">| AICTE Security Deposit / FDR Portal</small></span>`+(ME?`<a href="#/dash">Dashboard</a>${ME.role==='institution'?'<a href="#/new">Submit FDR</a>':'<a href="#/rel">Releases</a><a href="#/audit">Audit</a><a onclick="csv()">Export CSV</a>'}<span>${esc(ME.name)} (${ME.role})</span><a onclick="logout()">Logout</a>`:'')}
function out(h){nav();const f=FLASH.map(m=>`<div class="msg ${m[1]}">${esc(m[0])}</div>`).join('');FLASH=[];$('#app').innerHTML=f+h}
async function render(){if(!DB){DB=JSON.parse(localStorage.getItem('ns_db')||'null');if(!DB){DB=await seed();save()}}
 const p=(location.hash||'#/').slice(2).split('/'),r=p[0]||'',pub=['bank','verify','login','register'];
 if(!ME&&!pub.includes(r))return location.hash='#/login';
 try{const V={'':()=>location.hash=ME?'#/dash':'#/login',login:vLogin,register:vReg,dash:vDash,new:vNew,fdr:()=>vFdr(p[1]),bank:()=>vBank(p[1]),rel:vRel,order:()=>vOrder(p[1]),verify:()=>vVerify(p[1]),audit:vAudit};(V[r]||V[''])()}catch(e){out(`<div class="card">Something went wrong: ${esc(e.message)}</div>`)}}
function vLogin(){out(`<div class="card mid"><h2>Login</h2>Username<input id="u">Password<input id="p" type="password"><button onclick="login()">Login</button><p class="small">Institution? <a class="l" href="#/register">Register here</a>.</p><p class="small">Demo accounts: admin/admin123, officer/officer123, college/college123.</p></div>`)}
async function login(){const u=DB.users.find(x=>x.u===$('#u').value.trim()&&x.p===null);const h=await sha($('#p').value);const m=DB.users.find(x=>x.u===$('#u').value.trim()&&x.p===h);
 if(!m){flash('Invalid username or password.','err');return render()}ME=m;sessionStorage.setItem('ns_me',JSON.stringify(m));await audit('login');save();location.hash='#/dash';render()}
function logout(){ME=null;sessionStorage.removeItem('ns_me');location.hash='#/login';render()}
function vReg(){out(`<div class="card mid"><h2>Institution registration</h2>Institution name<input id="n">AICTE ID<input id="a">Username<input id="u">Password (min 6)<input id="p" type="password"><button onclick="reg()">Register</button></div>`)}
async function reg(){const n=$('#n').value.trim(),a=$('#a').value.trim(),u=$('#u').value.trim(),p=$('#p').value;
 if(!n||!a||!u||p.length<6){flash('Fill all fields (password at least 6 characters).','err');return render()}
 if(DB.users.some(x=>x.u===u)||DB.insts.some(i=>i.aicte===a)){flash('Username or AICTE ID already exists.','err');return render()}
 const id=++DB.n.i;DB.insts.push({id,name:n,aicte:a});DB.users.push({u,p:await sha(p),role:'institution',inst:id,name:n});await audit('register',n);save();flash('Registered. Please log in.');location.hash='#/login';render()}
function vDash(){const all=DB.fdrs;
 if(ME.role==='institution'){const rows=all.filter(f=>f.inst===ME.inst).reverse();
  return out(`<h2>My FDRs</h2><a class="btn" href="#/new">+ Submit new FDR</a><div class="card" style="margin-top:14px"><table><tr><th>Case</th><th>FDR</th><th>Amount (Rs)</th><th>Maturity</th><th>Status</th><th>Trust</th><th>Risk</th></tr>${rows.map(f=>row(f)).join('')||'<tr><td colspan=7>No FDRs yet.</td></tr>'}</table></div>`+rows.filter(f=>f.status!=='released'&&flags(f).length).map(f=>`<div class="card"><b>${esc(f.fdr)}</b> needs attention:<ul>${flags(f).map(x=>`<li>${esc(x[1])}</li>`).join('')}</ul></div>`).join(''))}
 const live=all.filter(f=>!done(f)),S={Total:all.length,Active:live.filter(f=>dd(f.maturity)>=0).length,'Expiring in 30 days':live.filter(f=>{const d=dd(f.maturity);return d>=0&&d<=30}).length,'Matured / overdue':live.filter(f=>dd(f.maturity)<0).length,'Pending verification':all.filter(f=>f.status==='submitted').length,Renewed:all.filter(f=>f.status==='renewed').length,Released:all.filter(f=>f.status==='released').length,'Trust L3+':all.filter(f=>lvl(f)>=3).length,'Release requests open':DB.rel.filter(r=>['requested','recommended'].includes(r.status)).length};
 const bk={};live.forEach(f=>{const b=bk[f.bank]=bk[f.bank]||[0,0];b[0]++;b[1]+=f.amount});
 out(`<h2>Regulation Bureau Dashboard</h2><div class="grid">${Object.entries(S).map(([k,v])=>`<div class="st"><b>${v}</b>${k}</div>`).join('')}</div><div class="card"><h3>Runway: highest risk first</h3><table><tr><th>Case</th><th>Institution</th><th>FDR</th><th>Amount (Rs)</th><th>Maturity</th><th>Status</th><th>Trust</th><th>Risk</th><th>Escalated to</th></tr>${[...live].sort((a,b)=>risk(b)-risk(a)).slice(0,15).map(f=>row(f,1)).join('')||'<tr><td colspan=9>Nothing pending.</td></tr>'}</table></div><div class="card"><h3>Issuer concentration (live FDRs by bank)</h3><table><tr><th>Bank</th><th>FDRs</th><th>Amount (Rs)</th></tr>${Object.entries(bk).sort((a,b)=>b[1][1]-a[1][1]).map(([b,v])=>`<tr><td>${esc(b)}</td><td>${v[0]}</td><td>${inr(v[1])}</td></tr>`).join('')}</table></div>`)}
function vNew(){const par=new URLSearchParams(location.hash.split('?')[1]||'').get('parent');if(ME.role!=='institution')return out('<div class="card">Only institutions submit FDRs.</div>');
 out(`<div class="card" style="max-width:640px;margin:auto"><h2>${par?'Submit renewal / replacement FDR':'Submit FDR'}</h2>FDR number<input id="no">Issuing bank<input id="bk">Bank type<select id="bt"><option>Scheduled commercial</option><option>Cooperative</option><option>Small finance</option><option>Other</option></select>Amount (Rs)<input id="am" type="number" step="0.01">Issue date<input id="is" type="date">Maturity date<input id="mt" type="date">Approved seats supported by this FDR<input id="se" type="number" min="0" value="0">Authorised signatory<input id="sg"><label><input id="li" type="checkbox"> Lien is marked in favour of AICTE</label><br><br>FDR document (PDF/PNG/JPG, max 1 MB)<input id="dc" type="file" accept=".pdf,.png,.jpg,.jpeg"><button onclick="submitF(${par||0})">Submit</button></div>`)}
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsArrayBuffer(f)});
async function submitF(par){const g=i=>$('#'+i).value.trim();if(!g('no')||!g('bk')||!g('am')||!g('is')||!g('mt')||isNaN(+g('am'))){flash('Please fill FDR number, bank, amount and both dates.','err');return render()}
 const f={id:++DB.n.f,inst:ME.inst,fdr:g('no'),bank:g('bk'),btype:g('bt'),amount:+g('am'),issue:g('is'),maturity:g('mt'),lien:$('#li').checked,seats:+g('se')||0,sign:g('sg'),status:'submitted',parent:par||null,created:today(),doc:null,hash:null};
 const fl=$('#dc').files[0];if(fl){if(fl.size>1048576){DB.n.f--;flash('File is larger than 1 MB.','err');return render()}const buf=await rd(fl);f.hash=await sha(buf);
  let bin='';new Uint8Array(buf).forEach(b=>bin+=String.fromCharCode(b));f.doc={name:fl.name,mime:fl.type||'application/octet-stream',data:btoa(bin)}}
 DB.fdrs.push(f);await audit('fdr_submitted',`case ${f.id} ${f.fdr}`);try{save()}catch(e){DB.fdrs.pop();DB.n.f--;flash('Browser storage is full. Remove old data or upload a smaller file.','err');return render()}
 flash('FDR submitted. An officer will check the document.');location.hash='#/fdr/'+f.id;render()}
function vFdr(id){const f=byId(id);if(!f||(ME.role==='institution'&&f.inst!==ME.inst))return out('<div class="card">Case not found.</div>');
 const L=lvl(f),rs=ready(f),fl=flags(f),chain=[];let p=f.parent;while(p){const x=byId(p);if(!x)break;chain.unshift(x);p=x.parent}const kids=DB.fdrs.filter(x=>x.parent===f.id);
 const off=ME.role!=='institution',rels=DB.rel.filter(r=>r.fdr===f.id).reverse();
 const A=[['doc_ok','Mark document checked',''],['scrutiny','Pass scrutiny',''],['bank_link','Create bank confirmation link','o'],['verify','Mark verified','g'],['reject','Reject','r']].map(a=>`<button class="${a[2]}" onclick="act(${f.id},'${a[0]}')">${a[1]}</button>`).join('');
 out(`<h2>Case #${f.id}: ${esc(f.fdr)}</h2><div class="two"><div class="card"><table><tr><th>Institution</th><td>${esc(iname(f))}</td></tr><tr><th>Bank</th><td>${esc(f.bank)} (${esc(f.btype)})</td></tr><tr><th>Amount</th><td>Rs ${inr(f.amount)}</td></tr><tr><th>Issue / Maturity</th><td>${f.issue} to ${f.maturity} (${dd(f.maturity)} days left)</td></tr><tr><th>Status</th><td>${label(f)}</td></tr><tr><th>Seats supported</th><td>${f.seats}</td></tr><tr><th>Signatory</th><td>${esc(f.sign||'-')}</td></tr><tr><th>Lien to AICTE</th><td>${f.lien?'Declared':'Not declared'}</td></tr><tr><th>Risk / escalation</th><td>${tag(risk(f))} ${esc2(f)}</td></tr><tr><th>Document</th><td>${f.doc?`<a class="l" onclick="viewDoc(${f.id})">${esc(f.doc.name)}</a><br><span class="small">SHA-256 ${f.hash.slice(0,20)}...</span>`:'None'}</td></tr><tr><th>Bank confirmation</th><td>${esc(f.bank_by||'Not yet')} ${f.bank_at||''}</td></tr><tr><th>AICTE reconciliation</th><td>${esc(f.recon||'Not yet')}</td></tr></table></div>
 <div class="card"><h3>Provenance ladder</h3><div class="lad">${['Claimed','Document matched','Scrutiny passed','Bank confirmed','AICTE reconciled'].map((t,n)=>`<div class="${L>=n?'on':''}">L${n}<br>${t}</div>`).join('')}</div><h3>Flags</h3>${fl.map(x=>`<p><span class="tag ${x[0]}">${x[0]}</span> ${esc(x[1])}</p>`).join('')||'<p>No flags raised.</p>'}<h3>History</h3>${chain.map(c=>`<p class="small">Earlier: <a class="l" href="#/fdr/${c.id}">${esc(c.fdr)}</a> (${c.status})</p>`).join('')}${kids.map(c=>`<p class="small">Renewal: <a class="l" href="#/fdr/${c.id}">${esc(c.fdr)}</a> (${c.status})</p>`).join('')}</div></div>
 ${off?`<div class="card"><h3>Officer actions</h3>${LINK[f.id]?`<div class="msg okm">Send this one-time link to the bank officer (opens in this browser):<br><code>${esc(LINK[f.id])}</code></div>`:''}${A}<p style="margin-top:12px">AICTE receipt / lien reference<input id="ref"><button onclick="recon(${f.id})">Reconcile (L4)</button></p>Scrutiny remark<textarea id="rm" rows="2"></textarea><button onclick="remark(${f.id})">Add remark</button></div>`
 :(!['released','rejected'].includes(f.status)?`<div class="card"><a class="btn" href="#/new?parent=${f.id}">Submit renewal / replacement</a><h3 style="margin-top:16px">Request release / refund</h3>Reason<textarea id="rr" rows="2"></textarea><label><input id="cy" type="checkbox"> Approval cycle is closed or a replacement FDR is in place</label><br><br><button onclick="relReq(${f.id})">Request release</button></div>`:'')}
 <div class="card"><h3>Release readiness: ${rs.length?'BLOCKED':'READY'}</h3>${rs.map(x=>`<p>- ${x}</p>`).join('')}${rels.map(r=>`<p>Request #${r.id} (${r.date}): <b>${r.status}</b> ${r.status==='approved'?`<a class="l" href="#/order/${r.id}">Release order</a>`:''}</p>`).join('')}</div>
 <div class="card"><h3>Remarks</h3>${DB.rem.filter(m=>m.fdr===f.id).reverse().map(m=>`<p><b>${esc(m.u)}</b> <span class="small">${m.ts}</span><br>${esc(m.t)}</p>`).join('')||'<p>None.</p>'}</div>`)}
function viewDoc(id){const d=byId(id).doc,b=Uint8Array.from(atob(d.data),c=>c.charCodeAt(0));window.open(URL.createObjectURL(new Blob([b],{type:d.mime})))}
async function act(id,a){const f=byId(id);let m='Done.';
 if(a==='doc_ok'){f.docok=1;m='Document checked (L1).'}else if(a==='scrutiny'){f.scr=1;m='Scrutiny passed.'}
 else if(a==='verify'){f.status='verified';if(f.parent){const p=byId(f.parent);if(p)p.status='renewed'}m='Case marked verified.'}else if(a==='reject'){f.status='rejected';m='Case rejected.'}
 else if(a==='bank_link'){const t=rnd();DB.tok.push({t,fdr:id,exp:iso(new Date(Date.now()+7*864e5)),used:0});LINK[id]=location.href.split('#')[0]+'#/bank/'+t;m='Bank confirmation link created (valid 7 days).'}
 await audit('fdr_'+a,'case '+id);save();flash(m);render()}
async function recon(id){const r=$('#ref').value.trim();if(!r){flash('Enter the AICTE receipt / lien reference.','err');return render()}byId(id).recon=r;await audit('fdr_recon','case '+id);save();flash('Reconciled with AICTE record (L4).');render()}
async function remark(id){const t=$('#rm').value.trim();if(t){DB.rem.push({fdr:id,u:ME.u,t,ts:new Date().toISOString().slice(0,16).replace('T',' ')});await audit('fdr_remark','case '+id);save();flash('Remark added.')}render()}
function vBank(t){const k=DB.tok.find(x=>x.t===t);if(!k||k.used||k.exp<today())return out('<div class="card mid"><h2>Bank FDR confirmation</h2><p>This link is invalid, expired or already used.</p></div>');const f=byId(k.fdr);
 out(`<div class="card mid"><h2>Bank FDR confirmation</h2><p>Please confirm whether this FDR exists and is lien-marked in favour of AICTE.</p><table><tr><th>FDR number</th><td>${esc(f.fdr)}</td></tr><tr><th>Bank</th><td>${esc(f.bank)}</td></tr><tr><th>Amount</th><td>Rs ${inr(f.amount)}</td></tr><tr><th>Issue / Maturity</th><td>${f.issue} / ${f.maturity}</td></tr></table>Your name<input id="bn">Designation / branch<input id="bd"><label><input type="radio" name="dc" value="c" checked> Confirm: details are correct and lien is marked</label><br><label><input type="radio" name="dc" value="d"> Dispute</label>Reason (if disputing)<textarea id="br"></textarea><button onclick="bankSend('${t}')">Submit</button></div>`)}
async function bankSend(t){const k=DB.tok.find(x=>x.t===t),f=byId(k.fdr),n=$('#bn').value.trim(),d=$('#bd').value.trim();if(!n||!d){flash('Enter your name and designation.','err');return render()}
 const who=`${n} (${d})`,conf=document.querySelector('input[name=dc]:checked').value==='c';k.used=1;
 if(conf){f.bank_by=who;f.bank_at=new Date().toISOString().slice(0,19).replace('T',' ');await audit('bank_confirmed',`case ${f.id} by ${who}`)}else{(f.disp=f.disp||[]).push($('#br').value||'no reason given');await audit('bank_disputed',`case ${f.id} by ${who}`)}
 save();out(`<div class="card mid"><h2>Bank FDR confirmation</h2><p>${conf?'Thank you. Confirmation recorded.':'Dispute recorded. AICTE will follow up.'}</p></div>`)}
async function relReq(id){const r=$('#rr').value.trim();if(!r){flash('Please give a reason.','err');return render()}DB.rel.push({id:++DB.n.r,fdr:id,reason:r,cycle:$('#cy').checked,status:'requested',date:today()});await audit('release_requested','case '+id);save();flash('Release request submitted.');render()}
function vRel(){out('<h2>Release / refund requests</h2>'+([...DB.rel].reverse().map(r=>{const f=byId(r.fdr),rs=ready(f);return `<div class="card"><b>Request #${r.id}</b> for <a class="l" href="#/fdr/${f.id}">${esc(f.fdr)}</a> (${esc(iname(f))}) - <b>${r.status}</b><br>Reason: ${esc(r.reason)}<br>Readiness: <b>${rs.length?'BLOCKED':'READY'}</b>${rs.map(x=>`<br>- ${x}`).join('')}<br><br>${r.status==='requested'?`<button onclick="relAct(${r.id},'recommend')">Recommend</button>`:''}${r.status==='recommended'&&ME.role==='admin'?`<button class="g" onclick="relAct(${r.id},'approve')">Approve and issue order</button>`:''}${['requested','recommended'].includes(r.status)?`<button class="r" onclick="relAct(${r.id},'reject')">Reject</button>`:''}${r.status==='approved'?`<a class="btn" href="#/order/${r.id}">Release order</a>`:''}</div>`}).join('')||'<p>No requests.</p>'))}
async function relAct(id,a){const r=DB.rel.find(x=>x.id===id),f=byId(r.fdr),rs=ready(f);
 if(a==='recommend'){if(rs.length){flash('Blocked: '+rs.join(' '),'err');return render()}r.status='recommended'}
 else if(a==='approve'){if(ME.role!=='admin'||r.status!=='recommended'||rs.length){flash('Only a ready, recommended request can be approved by the admin.','err');return render()}r.status='approved';r.code=rnd().slice(0,12).toUpperCase();f.status='released'}
 else r.status='rejected';await audit('release_'+a,`release ${id} case ${f.id}`);save();flash('Done.');render()}
function vOrder(id){const r=DB.rel.find(x=>x.id==id&&x.status==='approved');if(!r)return out('<div class="card">Not found.</div>');const f=byId(r.fdr);
 out(`<div class="card" style="max-width:700px;margin:auto"><h2>Release Order</h2><p>Order code: <b>${r.code}</b></p><p>FDR <b>${esc(f.fdr)}</b> (${esc(f.bank)}, Rs ${inr(f.amount)}) of <b>${esc(iname(f))}</b> is approved for release / discharge of AICTE lien.</p><p>Verify at: <code>${esc(location.href.split('#')[0]+'#/verify/'+r.code)}</code></p><button onclick="window.print()">Print</button></div>`)}
function vVerify(c){const r=DB.rel.find(x=>x.code===c&&x.status==='approved'),f=r&&byId(r.fdr);out(`<div class="card mid"><h2>Release order verification</h2>${r?`<p class="msg okm">VALID release order ${r.code}</p><p>FDR ${esc(f.fdr)} (${esc(f.bank)}, Rs ${inr(f.amount)}) of ${esc(iname(f))} was approved for release.</p>`:'<p class="msg err">NOT FOUND: this code does not match any approved release order.</p>'}</div>`)}
async function vAudit(){let prev='GENESIS',ok=true,bad=0;for(const r of DB.audit){const h=await sha(`${prev}|${r.ts}|${r.actor}|${r.a}|${r.d}`);if(r.prev!==prev||r.hash!==h){ok=false;bad=r.id;break}prev=h}
 out(`<h2>Tamper-evident audit trail</h2><div class="msg ${ok?'okm':'err'}">${ok?'Hash chain verified: no record has been altered.':'CHAIN BROKEN at entry #'+bad+': records were altered.'}</div><div class="card"><table><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th><th>Hash</th></tr>${[...DB.audit].reverse().slice(0,300).map(r=>`<tr><td>${r.id}</td><td>${r.ts}</td><td>${esc(r.actor)}</td><td>${esc(r.a)}</td><td>${esc(r.d)}</td><td class="small">${r.hash.slice(0,12)}</td></tr>`).join('')}</table></div>`)}
function csv(){const q=s=>`"${String(s).replace(/"/g,'""')}"`,rows=[['case','institution','fdr_no','bank','amount','issue','maturity','days_left','status','trust_level','risk','escalation','flags'].join(',')];
 DB.fdrs.forEach(f=>rows.push([f.id,iname(f),f.fdr,f.bank,f.amount,f.issue,f.maturity,dd(f.maturity),label(f),'L'+lvl(f),risk(f),esc2(f),flags(f).map(x=>x[1]).join('; ')].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='nidhisetu_fdrs.csv';a.click()}
window.onhashchange=render;render();
</script></body></html>
